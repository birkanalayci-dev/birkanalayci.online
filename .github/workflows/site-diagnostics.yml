name: Site diagnostics
# Geçici teşhis görevi: canlı alan adının gerçekte ne servis ettiğini ve
# GitHub Pages yapılandırmasını dışarıdan ölçer. Sorun çözülünce silinecek.

on:
  push:
    branches: [claude/cv-update-birkan-e1pq9n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Restore custom domain if missing
        run: |
          set +e
          CUR=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("cname") or "")')
          echo "mevcut cname: '$CUR'"
          if [ -z "$CUR" ]; then
            echo 'cname bos — birkanalayci.online geri yaziliyor'
            curl -sS -o /tmp/put.out -w 'PUT status: %{http_code}\n' -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"cname":"birkanalayci.online","build_type":"workflow"}' \
              https://api.github.com/repos/${{ github.repository }}/pages
            cat /tmp/put.out
          else
            echo 'cname zaten ayarli, dokunulmadi'
          fi
          echo '--- dogrulama: guncel Pages yapilandirmasi ---'
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
          exit 0

  diag:
    needs: fix-domain
    runs-on: ubuntu-latest
    steps:
      - name: Wait for domain binding
        run: sleep 5

      - name: Cache-bypass fetch via Cloudflare (decisive)
        run: |
          set +e
          BUST="cfdiag$RANDOM$RANDOM"
          echo "=== https://birkanalayci.online/hakkimda/?$BUST ==="
          curl -sS -D /tmp/hb.txt -o /tmp/bust.html --max-time 30 "https://birkanalayci.online/hakkimda/?$BUST"
          head -10 /tmp/hb.txt
          echo "ardanuc_count=$(grep -c 'Ardanuç' /tmp/bust.html)"
          grep -o '<title>[^<]*' /tmp/bust.html | head -1
          grep -oiE 'always online|snapshot|error code' /tmp/bust.html | sort -u | head -3
          wc -c /tmp/bust.html
          exit 0

      - name: Hunt the frozen deployment (candidate host sweep)
        run: |
          set +e
          # Haziran sayfasinin isaretleri: "Tıp eğitimi" (eski satir) + ~19851 bayt
          for base in birkanalayci birkanalayci-online birkanalaycionline birkan-alayci birkanalayci-dev drbirkanalayci birkanalayci-site uzmdrbirkanalayci birkanalayci-cv cv-birkanalayci birkanalayci-web velo-birkanalayci alayci birkanalayci-astro; do
            for suf in netlify.app vercel.app pages.dev onrender.com web.app firebaseapp.com surge.sh gitlab.io; do
              url="https://$base.$suf/hakkimda/"
              out=$(curl -sSk -o /tmp/c.html -w '%{http_code}' --max-time 10 "$url" 2>/dev/null)
              if [ "$out" = "200" ]; then
                old=$(grep -c 'Tıp eğitimi' /tmp/c.html)
                new=$(grep -c 'Ardanuç' /tmp/c.html)
                size=$(wc -c < /tmp/c.html)
                echo "MATCH-CANDIDATE $url http=$out size=$size eski_icerik=$old yeni_icerik=$new"
              fi
            done
          done
          echo "sweep bitti"
          exit 0

      - name: Who serves the 404 page (fingerprint)
        run: |
          set +e
          curl -sS -D /tmp/h404.txt -o /tmp/p404.html --max-time 30 "https://birkanalayci.online/cfprobe-yok-boyle-sayfa-$RANDOM/"
          head -6 /tmp/h404.txt
          echo "--- 404 govdesi (tamami) ---"
          cat /tmp/p404.html
          echo ""
          echo "--- 404 govde sonu ---"
          wc -c /tmp/p404.html
          exit 0

      - name: Origin certificate state
        run: |
          set +e
          echo | openssl s_client -servername birkanalayci.online -connect 185.199.108.153:443 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
          exit 0
      - name: DNS from runner
        run: |
          set +e
          echo '--- A/AAAA birkanalayci.online ---'
          getent ahosts birkanalayci.online | sort -u
          echo '--- www ---'
          getent ahosts www.birkanalayci.online | sort -u
          exit 0

      - name: Live site via Cloudflare
        run: |
          set +e
          echo '=== https://birkanalayci.online/hakkimda/ ==='
          curl -sS -D /tmp/h.txt -o /tmp/live.html --max-time 30 https://birkanalayci.online/hakkimda/
          echo '--- response headers ---'
          cat /tmp/h.txt
          echo '--- content signals ---'
          echo "ardanuc_count=$(grep -c 'Ardanuç' /tmp/live.html)"
          echo "istinye_count=$(grep -c 'İstinye' /tmp/live.html)"
          grep -o '<title>[^<]*' /tmp/live.html | head -1
          wc -c /tmp/live.html
          echo '=== root https://birkanalayci.online/ ==='
          curl -sS -o /dev/null -D - --max-time 30 https://birkanalayci.online/ | head -25
          exit 0

      - name: Direct GitHub Pages origin (bypass Cloudflare)
        run: |
          set +e
          for ip in 185.199.108.153 185.199.109.153; do
            echo "=== via $ip (sertifika dogrulamasi kapali; icerik kontrolu) ==="
            curl -sSk -D /tmp/h2.txt -o /tmp/direct.html --max-time 30 \
              --resolve birkanalayci.online:443:$ip https://birkanalayci.online/hakkimda/
            head -8 /tmp/h2.txt
            echo "ardanuc_count=$(grep -c 'Ardanuç' /tmp/direct.html)"
            grep -o '<title>[^<]*' /tmp/direct.html | head -1
          done
          exit 0

      - name: github.io origin behavior
        run: |
          set +e
          echo '=== https://birkanalayci-dev.github.io/hakkimda/ (redirect takip edilmeden) ==='
          curl -sS -D - -o /tmp/ghio.html --max-time 30 https://birkanalayci-dev.github.io/hakkimda/ | head -25
          echo "ardanuc_count=$(grep -c 'Ardanuç' /tmp/ghio.html)"
          exit 0

      - name: Pages API configuration
        run: |
          set +e
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
          exit 0
