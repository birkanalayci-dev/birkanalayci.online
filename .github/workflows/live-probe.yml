name: Live probe
# Geçici: canlı alan adının şu an ne servis ettiğini ve Pages yapılandırmasını ölçer.

on:
  push:
    branches: [claude/cv-update-birkan-e1pq9n]

permissions:
  contents: read
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live pages now
        run: |
          set +e
          for path in "/" "/hakkimda/" "/arastirma/"; do
            echo "=== https://birkanalayci.online$path ==="
            code=$(curl -sS -D /tmp/h.txt -o /tmp/b.html -w '%{http_code}' --max-time 30 "https://birkanalayci.online$path")
            echo "http=$code"
            grep -iE '^(cf-cache-status|cache-control|content-type|server|last-modified|etag|x-github-request-id|via|age):' /tmp/h.txt
            echo "ardanuc=$(grep -c 'Ardanuç' /tmp/b.html) style_blok=$(grep -c '<style' /tmp/b.html) boyut=$(wc -c < /tmp/b.html)"
            grep -o '<title>[^<]*' /tmp/b.html | head -1
            echo "--- govde ilk 300 karakter ---"
            head -c 300 /tmp/b.html; echo ""
          done
          exit 0

      - name: Pages API config
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages

      - name: Cloudflare scan (runs only when CLOUDFLARE_API_TOKEN secret exists)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret'ı tanımlı değil — tarama atlandı."
            echo "Secret eklendiğinde bu adım zone'u, DNS kayıtlarını, Workers route'larını ve Pages projelerini otomatik listeler."
            exit 0
          fi
          H="Authorization: Bearer $CF_TOKEN"
          echo '=== token doğrulama ==='
          curl -sS -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify
          echo ''
          echo '=== zone ==='
          curl -sS -H "$H" "https://api.cloudflare.com/client/v4/zones?name=birkanalayci.online" | head -c 2000
          echo ''
          ZID=$(curl -sS -H "$H" "https://api.cloudflare.com/client/v4/zones?name=birkanalayci.online" | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          echo "zone_id=$ZID"
          [ -z "$ZID" ] && exit 0
          echo '=== DNS kayıtları ==='
          curl -sS -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" | python3 -c 'import json,sys; [print(r["type"], r["name"], "->", r.get("content"), "proxied=" + str(r.get("proxied"))) for r in json.load(sys.stdin)["result"]]'
          echo '=== Workers route listesi ==='
          curl -sS -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZID/workers/routes"
          echo ''
          echo '=== hesap ve Pages/Workers projeleri ==='
          AID=$(curl -sS -H "$H" "https://api.cloudflare.com/client/v4/accounts" | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          echo "account_id=$AID"
          [ -n "$AID" ] && curl -sS -H "$H" "https://api.cloudflare.com/client/v4/accounts/$AID/pages/projects" | head -c 3000
          echo ''
          [ -n "$AID" ] && curl -sS -H "$H" "https://api.cloudflare.com/client/v4/accounts/$AID/workers/scripts" | head -c 2000
          echo ''
